name: Recce CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: recce-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recce-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dbt
        run: uv pip install dbt-core dbt-snowflake --system

      - name: Install Recce
        run: uv pip install recce --system

      - name: Prepare dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          default:
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 4
            target: dev
          EOF

      - name: Download production artifacts from Recce Cloud
        run: recce-cloud download --type prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare PR environment
        run: |
          dbt deps
          dbt build
          dbt docs generate

      - name: Run Recce
        run: recce run

      - name: Upload PR artifacts to Recce Cloud
        run: recce-cloud upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Recce summary to PR
        run: |
          recce summary > recce_summary.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file recce_summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
